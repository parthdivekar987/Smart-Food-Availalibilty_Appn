# Netlify deploys only the React frontend (the Express/Socket.IO backend is hosted separately, e.g. Render).
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 needs Node 20.19+
  NODE_VERSION = "22"
  # Public backend (Render service from render.yaml). Override in Netlify > Environment variables if it differs.
  VITE_API_BASE_URL = "https://smartfood-restaurant-api-pd.onrender.com/api/v1"
  VITE_FRONTEND_URL = "https://delicate-gaufre-bdd7c8.netlify.app"

# Single-page app: let React Router handle every path (fixes 404 on refresh / deep links)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
